<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NecAuth - Two-Factor Authenticator</title>
<meta name="description" content="NecAuth - premium two-factor authenticator by NECXY DEVELOPER.">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-telegram" viewBox="0 0 24 24" fill="currentColor"><path d="M21.94 4.63 18.9 18.95c-.23 1.02-.84 1.27-1.7.79l-4.7-3.47-2.27 2.19c-.25.25-.46.46-.95.46l.34-4.86 8.85-8c.38-.34-.08-.53-.6-.19l-10.94 6.89-4.71-1.47c-1.02-.32-1.04-1.02.21-1.51L20.6 3.2c.85-.32 1.6.19 1.34 1.43Z"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7M7 3v4a1 1 0 0 0 1 1h7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M14 3.5V5a2 2 0 0 0 2 2h1.5M8 8h.01M12 12h.01M16 16h.01M8 16h.01"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7M5 11l7 7"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
  </defs>
</svg>

<div class="orb orb-a"></div>
<div class="orb orb-b"></div>

<header class="header">
  <div class="header-inner">
    <span class="brand-name">Nec<span>Auth</span></span>
    <a class="tg-btn" href="https://t.me/i_necxy" target="_blank" rel="noopener" aria-label="Telegram - @i_necxy" title="@i_necxy">
      <svg><use href="#i-telegram"/></svg>
    </a>
  </div>
</header>

<main class="center">
  <div class="glass box anim-in">
    <div class="box-icon"><svg><use href="#i-shield"/></svg></div>
    <h1>Two-Factor Authentication</h1>

    <div class="tabs" role="tablist">
      <button class="tab active" id="tabGenerate" type="button">Generate</button>
      <button class="tab" id="tabVerify" type="button">Verify</button>
      <i class="tab-glider"></i>
    </div>

    <!-- GENERATE PANEL -->
    <section id="panelGenerate">
      <input class="input mono" id="secretInput" type="text" placeholder="Enter 2FA secret key" autocomplete="off" spellcheck="false">
      <div class="toolbar">
        <button class="tool" id="pasteBtn" type="button" title="Paste"><svg><use href="#i-paste"/></svg></button>
        <button class="tool" id="otpToggle" type="button" title="Import otpauth link"><svg><use href="#i-qr"/></svg></button>
        <button class="tool" id="randomBtn" type="button" title="New random secret"><svg><use href="#i-dice"/></svg></button>
        <button class="tool" id="clearBtn" type="button" title="Clear"><svg><use href="#i-eraser"/></svg></button>
        <div class="seg" title="Digits">
          <button type="button" class="seg-btn active" data-digits="6">6</button>
          <button type="button" class="seg-btn" data-digits="8">8</button>
        </div>
      </div>
      <div class="otp-row hidden" id="otpRow">
        <input class="input mono" id="otpauthInput" type="text" placeholder="otpauth://totp/..." autocomplete="off" spellcheck="false" style="text-transform:none">
        <button class="btn-small" id="otpImportBtn" type="button">Import</button>
      </div>
      <button class="btn-generate" id="generateBtn" type="button"><span>Generate Code</span></button>
      <p class="error" id="errorText"></p>
      <div class="result" id="resultBox">
        <div class="code-ring">
          <svg width="118" height="118"><circle cx="59" cy="59" r="52" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="5"/><circle id="ringFg" cx="59" cy="59" r="52" fill="none" stroke="#ff3b3b" stroke-width="5" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>
          <div class="code" id="codeText" title="Tap to copy">------</div>
        </div>
        <p class="expires"><b id="secondsLeft">30</b>s &middot; tap code to copy</p>
        <div class="save-row hidden" id="saveRow">
          <input class="input" id="saveName" type="text" placeholder="Account name" autocomplete="off">
          <button class="btn-small" id="saveBtn" type="button"><svg><use href="#i-save"/></svg> Save</button>
        </div>
      </div>
    </section>

    <!-- VERIFY PANEL -->
    <section id="panelVerify" class="hidden">
      <input class="input mono" id="verifySecret" type="text" placeholder="Enter 2FA secret key" autocomplete="off" spellcheck="false">
      <input class="input mono" id="verifyCode" type="text" inputmode="numeric" maxlength="8" placeholder="Enter code" autocomplete="one-time-code">
      <button class="btn-generate" id="verifyBtn" type="button"><span>Verify Code</span></button>
      <p class="verify-result" id="verifyResult"></p>
    </section>
  </div>

  <!-- SAVED ACCOUNTS -->
  <section class="glass saved anim-in d1 hidden" id="savedSection">
    <div class="saved-head"><h2>Saved</h2><span id="savedCount"></span></div>
    <div id="savedList"></div>
  </section>
</main>

<footer>
  <p class="f-line1">Developed by <b>NECXY DEVELOPER</b></p>
  <p>Crafting clean, fast and secure tools - made with passion by Necxy.</p>
  <p>Telegram @i_necxy &middot; NecAuth &copy; 2026</p>
</footer>

<div class="toast" id="toast" role="status"></div>

<script src="js/totp.js"></script>
<script src="js/app.js"></script>
</body>
</html>
