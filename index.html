<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NecAuth - Two-Factor Authenticator</title>
<meta name="description" content="NecAuth - premium two-factor authenticator by NECXY DEVELOPER.">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-telegram" viewBox="0 0 24 24" fill="currentColor"><path d="M21.94 4.63 18.9 18.95c-.23 1.02-.84 1.27-1.7.79l-4.7-3.47-2.27 2.19c-.25.25-.46.46-.95.46l.34-4.86 8.85-8c.38-.34-.08-.53-.6-.19l-10.94 6.89-4.71-1.47c-1.02-.32-1.04-1.02.21-1.51L20.6 3.2c.85-.32 1.6.19 1.34 1.43Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7M7 3v4a1 1 0 0 0 1 1h7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
  </defs>
</svg>

<div class="orb orb-a"></div>
<div class="orb orb-b"></div>
<div class="orb orb-c"></div>
<span class="particle" style="left:12%;animation-delay:0s"></span>
<span class="particle" style="left:28%;animation-delay:3s"></span>
<span class="particle" style="left:47%;animation-delay:6s"></span>
<span class="particle" style="left:66%;animation-delay:2s"></span>
<span class="particle" style="left:82%;animation-delay:5s"></span>
<span class="particle" style="left:93%;animation-delay:8s"></span>

<header class="header">
  <div class="header-inner">
    <span class="brand-name">Nec<span>Auth</span></span>
    <a class="tg-btn" href="https://t.me/i_necxy" target="_blank" rel="noopener" aria-label="Telegram - @i_necxy" title="@i_necxy">
      <svg><use href="#i-telegram"/></svg>
    </a>
  </div>
</header>

<main class="center">
  <div class="box-wrap anim-in">
    <div class="glass box">
      <div class="box-icon"><svg><use href="#i-shield"/></svg></div>
      <h1>Two-Factor Authentication</h1>

      <div class="input-row">
        <input class="input mono" id="secretInput" type="text" placeholder="Enter 2FA secret key" autocomplete="off" spellcheck="false">
        <button class="paste-btn" id="pasteBtn" type="button" title="Paste" aria-label="Paste secret key"><svg><use href="#i-paste"/></svg></button>
      </div>

      <button class="btn-generate" id="generateBtn" type="button"><span>Generate Code</span></button>
      <p class="error" id="errorText"></p>

      <div class="result" id="resultBox">
        <div class="code-card" id="codeCard" title="Tap to copy">
          <div class="code" id="codeText">--- ---</div>
          <button class="copy-btn" id="copyBtn" type="button" title="Copy code" aria-label="Copy code"><svg><use id="copyUse" href="#i-copy"/></svg><span class="copy-chip">Copied</span></button>
          <i class="sweep"></i>
        </div>
        <div class="bar"><i id="timeBar"></i></div>
        <p class="expires">Expires in <b id="secondsLeft">30</b>s</p>
        <div class="save-row hidden" id="saveRow">
          <input class="input" id="saveName" type="text" placeholder="Account name" autocomplete="off">
          <button class="btn-small" id="saveBtn" type="button"><svg><use href="#i-save"/></svg> Save</button>
        </div>
      </div>
    </div>
  </div>

  <section class="glass saved anim-in d1 hidden" id="savedSection">
    <div class="saved-head"><h2>Saved</h2><span id="savedCount"></span></div>
    <div id="savedList"></div>
  </section>
</main>

<footer>
  <p class="f-line1">Developed by <b>NECXY DEVELOPER</b></p>
  <p>Crafting clean, fast and secure tools - made with passion by Necxy.</p>
  <p>Telegram @i_necxy &middot; NecAuth &copy; 2026</p>
</footer>

<script src="js/totp.js"></script>
<script src="js/app.js"></script>
</body>
</html>
