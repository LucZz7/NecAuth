<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NecAuth - Two-Factor Authenticator</title>
<meta name="description" content="NecAuth - two-factor authenticator by NECXY DEVELOPER. Enter a secret key, generate a real TOTP code.">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-telegram" viewBox="0 0 24 24" fill="currentColor"><path d="M21.94 4.63 18.9 18.95c-.23 1.02-.84 1.27-1.7.79l-4.7-3.47-2.27 2.19c-.25.25-.46.46-.95.46l.34-4.86 8.85-8c.38-.34-.08-.53-.6-.19l-10.94 6.89-4.71-1.47c-1.02-.32-1.04-1.02.21-1.51L20.6 3.2c.85-.32 1.6.19 1.34 1.43Z"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></symbol>
  </defs>
</svg>

<div class="orb orb-a"></div>
<div class="orb orb-b"></div>

<header class="header">
  <div class="header-inner">
    <span class="brand-name">Nec<span>Auth</span></span>
    <a class="tg-btn" href="https://t.me/i_necxy" target="_blank" rel="noopener" aria-label="Telegram - @i_necxy" title="@i_necxy">
      <svg><use href="#i-telegram"/></svg>
    </a>
  </div>
</header>

<main class="center">
  <form class="glass box anim-in" id="authForm">
    <div class="box-icon"><svg><use href="#i-key"/></svg></div>
    <h1>Two-Factor Authentication</h1>
    <label class="sr" for="secretInput">2FA Secret Key</label>
    <input class="input mono" id="secretInput" type="text" placeholder="Enter your 2FA secret key" autocomplete="off" spellcheck="false">
    <button class="btn-generate" type="submit"><span>Generate Code</span></button>
    <p class="error" id="errorText"></p>
    <div class="result" id="resultBox">
      <div class="code" id="codeText" title="Tap to copy">------</div>
      <div class="bar"><i id="timeBar"></i></div>
      <p class="expires">Expires in <b id="secondsLeft">30</b>s &middot; tap code to copy</p>
    </div>
  </form>
</main>

<footer>
  <p class="f-line1">Developed by <b>NECXY DEVELOPER</b></p>
  <p>Crafting clean, fast and secure tools - made with passion by Necxy.</p>
  <p>Telegram @i_necxy &middot; NecAuth &copy; 2026</p>
</footer>

<div class="toast" id="toast" role="status"></div>

<script src="js/totp.js"></script>
<script src="js/app.js"></script>
</body>
</html>
